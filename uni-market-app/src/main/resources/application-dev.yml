# 开发环境：H2 内存库，无需 Docker 即可启动验证
# 生产/联调切回 MySQL：spring.profiles.active=mysql
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:unimarket;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    cn.unimarket.infrastructure: DEBUG
